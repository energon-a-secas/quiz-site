<!DOCTYPE html>

  <meta name="theme-color" content="#040714">
  <!-- og:image is added when og-studio has rendered og-preview.jpg for this site (its entry there still reads CHANGE ME); a tag pointing at a missing file breaks every share card. -->
  <!-- Fleet design tokens: canonical, do not redeclare locally (PROJECTS.md section 5) -->
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/styles/base.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Neorgon Header Kit (vendored; ?header=live swaps CSS to CDN). Keep after style.css, the kit owns the header. -->
  <script>(function(){var m=location.search.match(/[?&]theme=([\w-]+)/)||document.cookie.match(/(?:^|;\s*)neo_theme=([\w-]+)/);if(m&&m[1]!=='default')document.documentElement.dataset.theme=decodeURIComponent(m[1]);})();</script>
  <link rel="stylesheet" href="css/neorgon-header.css">
  <link rel="stylesheet" href="css/neorgon-themes.css">
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/header/season.css">
  <script defer src="js/neorgon-header.js"></script>
  <!-- NeoKeys Kit (vendored). The ? sheet, the H chrome toggle and the WCAG 2.1.4
       remap panel. Registrations are in js/keys.js, not here; H is off in embed.
       See packages/neorgon-ui/keys/README.md. -->
  <script>try{if(/(?:^|;\s*)neo_chrome=off/.test(document.cookie))document.documentElement.dataset.chrome='off'}catch(e){}</script>
  <meta name="neo-chrome-toggle" content="on">
  <link rel="stylesheet" href="css/neorgon-keys.css">
  <!-- Neorgon Footer Kit (vendored). Pins the footer to the viewport floor on short
       pages and builds the meta bar + back-to-top. See packages/neorgon-ui/footer/README.md. -->
  <link rel="stylesheet" href="css/neorgon-footer.css">
  <script defer src="js/neorgon-footer.js"></script>
  <!-- Neorgon Beacon Kit (vendored). Bottom-left correction reporter: it
       carries page context to balise.neorgon.com in a URL fragment and the
       visitor writes there. No form on this page and no request from it. -->
  <meta name="beacon-site" content="quiz-site">
  <link rel="stylesheet" href="css/neorgon-beacon.css">
  <script defer src="js/neorgon-beacon.js"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Quiz",
    "description": "Small games that teach one thing at a time: count the beats of a loanword, pick the sound of a kana, match two columns, put a song line back in order. Every wrong answer is explained. Runs in the browser; nothing is uploaded.",
    "url": "https://quiz.neorgon.com/",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Any",
    "inLanguage": ["en", "es"],
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Organization", "name": "Neorgon", "url": "https://neorgon.com/" }
  }
  </script>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Neorgon Header Kit contract. app mode: slim 56px, auto-hides on scroll,
       so the round keeps the phone's height. -->
  <header class="header-bar" data-header-mode="app">
    <div class="header-logo">
      <a href="./" class="header-title-link">
        <img src="https://cdn.neorgon.org/v1.0.0/energon-classic-logo.png" class="header-logo-img" alt="">
        <div class="header-title-wrap">
          <h1>Quiz</h1>
          <div class="header-subtitle" data-ui="header.subtitle">Four small games for kana, beats and song lines</div>
        </div>
      </a>
    </div>
    <div class="header-right">
      <a class="header-home" href="https://neorgon.com/" title="neorgon.com" aria-label="Neorgon home">
        <svg class="nh-hub-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 4.4 18.58 8.2 18.58 15.8 12 19.6 5.42 15.8 5.42 8.2Z" fill="currentColor" stroke="none"/>
          <g class="nh-orbit">
            <path d="M2.47 17.50 A11.0 11.0 0 0 1 14.85 1.37" fill="none" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
            <path d="M21.53 6.50 A11.0 11.0 0 0 1 9.15 22.63" fill="none" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
            <circle cx="21.71" cy="6.84" r="1.25" fill="currentColor"/>
            <circle cx="2.29" cy="17.16" r="1.25" fill="currentColor"/>
          </g>
        </svg>
      </a>
    </div>
  </header>

  <!-- The surface. One column, no card around it: the page is the surface
       (DESIGN.md section 3). js/router.js paints the library, the round, the
       results or a named error into #quiz-root; the attribution renders only
       when the set's licence says screen: "required". -->
  <main id="main">
    <div class="q-surface">
      <div id="quiz-root"></div>
      <!-- The honesty line, CONTRACTS convention 2: shown once per screen when a
           Spanish reader was given English (a song name or gloss with es: null). -->
      <p class="q-lang-note" id="quiz-lang-note" data-ui="lang.fallback" hidden>Parts of this set have no Spanish yet and are shown in English.</p>
      <aside class="q-attrib" id="quiz-attrib" hidden></aside>
    </div>
    <p id="quiz-progress" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    <p id="quiz-verdict" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></p>
  </main>

  <!-- Neorgon Footer Kit contract. minimal: note + meta bar on one line. -->
  <footer class="neo-footer" data-footer-mode="minimal">
    <span data-ui="footer">Runs entirely in your browser. Scores stay on this device.</span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
